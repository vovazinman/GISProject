<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Drone System — Sequence Diagrams v2</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: #0d1220;
    --border: #1e2d4a;
    --presentation: #00d4ff;
    --application: #00ff9d;
    --domain: #a855f7;
    --infrastructure: #fbbf24;
    --external: #ff6b35;
    --critical: #ff3860;
    --text: #c8d6e8;
    --text-dim: #3a5070;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }

  body::before {
    content:'';
    position:fixed; inset:0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,212,255,0.012) 2px, rgba(0,212,255,0.012) 4px);
    pointer-events:none; z-index:999;
  }

  header {
    text-align:center;
    padding: 32px 20px 18px;
    border-bottom: 1px solid #0f1e30;
    position: relative;
  }

  h1 {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(1em, 2.8vw, 1.8em);
    color: var(--presentation);
    text-shadow: 0 0 20px rgba(0,212,255,0.6);
    letter-spacing: 5px;
  }

  .subtitle {
    font-size: 0.85em;
    color: var(--text-dim);
    margin-top: 5px;
    letter-spacing: 3px;
  }

  .version-badge {
    display: inline-block;
    background: rgba(0,212,255,0.1);
    border: 1px solid var(--presentation);
    color: var(--presentation);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7em;
    padding: 2px 10px;
    border-radius: 2px;
    margin-top: 6px;
    letter-spacing: 2px;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 18px 16px 0;
    flex-wrap: wrap;
    background: #080c14;
    border-bottom: 1px solid #0f1e30;
    padding-bottom: 0;
  }

  .tab-btn {
    background: transparent;
    border: 1px solid #1a2a40;
    border-bottom: none;
    color: var(--text-dim);
    padding: 9px 16px;
    border-radius: 4px 4px 0 0;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 0.82em;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
    position: relative;
    top: 1px;
  }

  .tab-btn:hover { color: #7ab; border-color: #2a4060; }

  .tab-btn.active {
    color: #fff;
    border-color: #1e3050;
    background: #0d1220;
    border-bottom: 1px solid #0d1220;
  }

  /* scenario color overrides */
  .tab-btn[data-sc="1"].active  { color: var(--presentation); border-top: 2px solid var(--presentation); }
  .tab-btn[data-sc="2"].active  { color: var(--external);     border-top: 2px solid var(--external); }
  .tab-btn[data-sc="3"].active  { color: var(--application);  border-top: 2px solid var(--application); }
  .tab-btn[data-sc="4"].active  { color: var(--domain);       border-top: 2px solid var(--domain); }
  .tab-btn[data-sc="5"].active  { color: var(--infrastructure);border-top: 2px solid var(--infrastructure); }
  .tab-btn[data-sc="6"].active  { color: #ff3860;             border-top: 2px solid #ff3860; }
  .tab-btn[data-sc="7"].active  { color: #06b6d4;             border-top: 2px solid #06b6d4; }

  /* ── Panel ── */
  .panel {
    display: none;
    padding: 24px 20px 40px;
    background: #0d1220;
    animation: fadeUp 0.3s ease;
  }
  .panel.active { display: block; }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .panel-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.88em;
    letter-spacing: 3px;
    color: var(--text-dim);
  }

  .replay-btn {
    background: transparent;
    border: 1px solid;
    padding: 6px 16px;
    border-radius: 3px;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72em;
    letter-spacing: 2px;
    transition: all 0.2s;
  }
  .replay-btn:hover { filter: brightness(1.3); }

  .rb-1 { border-color:var(--presentation); color:var(--presentation); }
  .rb-1:hover { background: rgba(0,212,255,0.08); }
  .rb-2 { border-color:var(--external); color:var(--external); }
  .rb-2:hover { background: rgba(255,107,53,0.08); }
  .rb-3 { border-color:var(--application); color:var(--application); }
  .rb-3:hover { background: rgba(0,255,157,0.08); }
  .rb-4 { border-color:var(--domain); color:var(--domain); }

  .global-legend {
    display: flex;

  }

  .gl-dash { width:22px; height:0; border-top: 2px dashed; }

// ─────────────────────────────────────────────────────
// Constants
// ─────────────────────────────────────────────────────
const ns = 'http://www.w3.org/2000/svg';
const BG = '#0d1220';

const LAYERS = {
  presentation:  { fill:'#040e1a', stroke:'#00d4ff', text:'#00d4ff' },
  application:   { fill:'#041208', stroke:'#00ff9d', text:'#00ff9d' },
  domain:        { fill:'#0c0415', stroke:'#a855f7', text:'#a855f7' },
  infrastructure:{ fill:'#130d00', stroke:'#fbbf24', text:'#fbbf24' },
  external:      { fill:'#150500', stroke:'#ff6b35', text:'#ff6b35' },
  critical:      { fill:'#150008', stroke:'#ff3860', text:'#ff3860' },
  analytics:     { fill:'#001515', stroke:'#06b6d4', text:'#06b6d4' },
};

// ─────────────────────────────────────────────────────
// SVG helpers
// ─────────────────────────────────────────────────────
function e(tag, attrs, text) {
  const el = document.createElementNS(ns, tag);
  for (const [k,v] of Object.entries(attrs||{})) el.setAttribute(k,v);
  if (text !== undefined) el.textContent = String(text);
  return el;
}

// ─────────────────────────────────────────────────────
// Draw actor header + footer + lifeline
// ─────────────────────────────────────────────────────
function drawActors(svg, actors, topY, bottomY) {
  const W = 108, H = 48;
  actors.forEach(a => {
    const c = LAYERS[a.layer];
    // header
    const g = e('g');
    g.appendChild(e('rect',{x:a.x-W/2, y:topY, width:W, height:H, rx:3, fill:c.fill, stroke:c.stroke, 'stroke-width':'1.5'}));
    g.appendChild(e('rect',{x:a.x-W/2, y:topY, width:W, height:3, rx:2, fill:c.stroke}));
    g.appendChild(e('text',{x:a.x, y:topY+18, fill:c.text, 'font-family':'Rajdhani,sans-serif',
      'font-weight':'700', 'font-size':'11', 'text-anchor':'middle'}, a.label));
    if (a.sub) g.appendChild(e('text',{x:a.x, y:topY+33, fill:c.text, opacity:'0.55',
      'font-family':'Share Tech Mono,monospace', 'font-size':'8.5', 'text-anchor':'middle'}, a.sub));
    svg.appendChild(g);

    // lifeline
    svg.appendChild(e('line',{x1:a.x, y1:topY+H, x2:a.x, y2:bottomY,
      stroke:c.stroke, 'stroke-dasharray':'5,4', 'stroke-width':'1', opacity:'0.25'}));

    // footer
    const g2 = e('g');
    g2.appendChild(e('rect',{x:a.x-W/2, y:bottomY, width:W, height:H, rx:3, fill:c.fill, stroke:c.stroke, 'stroke-width':'1.5'}));
    g2.appendChild(e('rect',{x:a.x-W/2, y:bottomY+H-3, width:W, height:3, rx:2, fill:c.stroke}));
    g2.appendChild(e('text',{x:a.x, y:bottomY+18, fill:c.text, 'font-family':'Rajdhani,sans-serif',
      'font-weight':'700', 'font-size':'11', 'text-anchor':'middle'}, a.label));
    if (a.sub) g2.appendChild(e('text',{x:a.x, y:bottomY+33, fill:c.text, opacity:'0.55',
      'font-family':'Share Tech Mono,monospace', 'font-size':'8.5', 'text-anchor':'middle'}, a.sub));
    svg.appendChild(g2);
  });
}

// ─────────────────────────────────────────────────────
// Draw section band
// ─────────────────────────────────────────────────────
function drawSection(svg, y, label, color, svgWidth) {
  svg.appendChild(e('rect',{x:0, y:y-1, width:svgWidth, height:28, fill:color, opacity:'0.04', rx:0}));
  svg.appendChild(e('text',{x:8, y:y+16,
    fill:color, 'font-family':'Share Tech Mono,monospace', 'font-size':'8.5',
    opacity:'0.45', 'letter-spacing':'2'}, label));
}

// ─────────────────────────────────────────────────────
// Draw one message — returns the group element
// ─────────────────────────────────────────────────────
function drawMsg(svg, x1, x2, y, label, color, isReturn=false, note=null, stepNum=null) {
  const g = e('g');
  g.style.opacity = '0';
  g.style.transition = 'opacity 0.32s ease';

  const dir = x2 >= x1 ? 1 : -1;
  const gap = 5;
  const lx2 = x2 + dir * (-gap);

  // line
  g.appendChild(e('line',{
    x1:String(x1), y1:String(y), x2:String(lx2), y2:String(y),
    stroke:color, 'stroke-width':'1.8',
    'stroke-dasharray': isReturn ? '6,3' : 'none'
  }));

  // arrowhead
  const ax = x2 + dir * (-1);
  if (isReturn) {
    g.appendChild(e('polyline',{
      points: dir>0 ? `${ax-9},${y-5} ${ax},${y} ${ax-9},${y+5}` : `${ax+9},${y-5} ${ax},${y} ${ax+9},${y+5}`,
      stroke:color, 'stroke-width':'1.5', fill:'none'
    }));
  } else {
    g.appendChild(e('polygon',{
      points: dir>0 ? `${ax-9},${y-5} ${ax},${y} ${ax-9},${y+5}` : `${ax+9},${y-5} ${ax},${y} ${ax+9},${y+5}`,
      fill:color
    }));
  }

  // origin dot
  g.appendChild(e('circle',{cx:String(x1), cy:String(y), r:'3', fill:color, opacity:'0.7'}));

  // label bg + text
  const mx = (x1+x2)/2;
  g.appendChild(e('rect',{x:mx-58, y:y-17, width:116, height:14, rx:2, fill:BG, opacity:'0.88'}));
  g.appendChild(e('text',{
    x:mx, y:y-6, fill:color, 'text-anchor':'middle',
    'font-family':'Share Tech Mono,monospace', 'font-size':'10'
  }, label));

  // note (perf annotation)
  if (note) {
    g.appendChild(e('text',{
      x:mx, y:y+13, fill:'#2a4060', 'text-anchor':'middle',
      'font-family':'Share Tech Mono,monospace', 'font-size':'8.5'
    }, note));
  }

  // step badge
  if (stepNum !== null) {
    const bx = x1 + dir*14;
    g.appendChild(e('circle',{cx:bx, cy:y, r:'8', fill:color, opacity:'0.15', stroke:color, 'stroke-width':'1'}));
    g.appendChild(e('text',{
      x:bx, y:y, 'text-anchor':'middle', 'dominant-baseline':'middle',
      fill:color, 'font-family':'Share Tech Mono,monospace', 'font-size':'8'
    }, String(stepNum)));
  }

  svg.appendChild(g);
  return g;
}

// ─────────────────────────────────────────────────────
// Animate a list of message groups
// ─────────────────────────────────────────────────────
function animate(msgs, delay=50) {
  msgs.forEach((g,i) => {
    g.style.opacity = '0';
    g.style.transition = 'none';
  });
  msgs.forEach((g,i) => {
    setTimeout(() => {
      g.style.transition = 'opacity 0.32s ease';
      g.style.opacity = '1';
    }, delay + i * 400);
  });
}

// ─────────────────────────────────────────────────────
// Build SVG for a scenario
// ─────────────────────────────────────────────────────
function buildSVG(config) {
  const { width, height, actors, messages, sections } = config;
  const svg = e('svg',{ class:'seq', width, height, viewBox:`0 0 ${width} ${height}` });
  svg.style.background = BG;
  svg.style.borderRadius = '6px';

  const topY = 20, bottomY = height - 68;

  // grid bg subtle
  for (let x = 0; x < width; x+=80)
    svg.appendChild(e('line',{x1:x, y1:0, x2:x, y2:height, stroke:'#0f1e2e', 'stroke-width':'0.5'}));
  for (let y = 0; y < height; y+=40)
    svg.appendChild(e('line',{x1:0, y1:y, x2:width, y2:y, stroke:'#0a1520', 'stroke-width':'0.5'}));

  drawActors(svg, actors, topY, bottomY);

  // sections
  (sections||[]).forEach(s => drawSection(svg, s.y, s.label, s.color, width));

  const msgs = [];
  messages.forEach(m => {
    const ax = actors.find(a=>a.id===m.from).x;
    const bx = actors.find(a=>a.id===m.to).x;
    const color = m.color || LAYERS[actors.find(a=>a.id===m.from).layer]?.stroke || '#888';
    const g = drawMsg(svg, ax, bx, m.y, m.label, color, m.return||false, m.note||null, m.step||null);
    msgs.push(g);
  });

  return { svg, msgs };
}

// ─────────────────────────────────────────────────────
// Build all tabs + panels
// ─────────────────────────────────────────────────────
const tabsEl   = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

const builtSVGs = {};

SCENARIOS.forEach((sc, idx) => {
  // Tab button
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (idx===0?' active':'');
  btn.setAttribute('data-sc', sc.id);
  btn.textContent = sc.tab;
  btn.onclick = () => switchTo(sc.id);
  tabsEl.appendChild(btn);

  // Panel
  const panel = document.createElement('div');
  panel.className = 'panel' + (idx===0?' active':'');
  panel.id = `panel-${sc.id}`;

  const hdr = document.createElement('div');
  hdr.className = 'panel-header';

  const title = document.createElement('div');
  title.className = 'panel-title';
  title.textContent = sc.title;

  const btn2 = document.createElement('button');
  btn2.className = `replay-btn ${sc.rbClass}`;
  btn2.textContent = '▶ REPLAY';
  btn2.onclick = () => animate(builtSVGs[sc.id], 50);

  hdr.appendChild(title);
  hdr.appendChild(btn2);

  const wrap = document.createElement('div');
  wrap.className = 'seq-wrap';

  panel.appendChild(hdr);
  panel.appendChild(wrap);
  panelsEl.appendChild(panel);

  // Build SVG
  const { svg, msgs } = buildSVG(sc.config);
  wrap.appendChild(svg);
  builtSVGs[sc.id] = msgs;

  if (idx === 0) animate(msgs, 300);
});

function switchTo(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`[data-sc="${id}"]`).classList.add('active');
  document.getElementById(`panel-${id}`).classList.add('active');
  setTimeout(() => animate(builtSVGs[id], 100), 50);
}
</script>
